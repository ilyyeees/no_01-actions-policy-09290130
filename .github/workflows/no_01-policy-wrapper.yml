name: no_01 policy wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - no_01-attacker-*

permissions:
  contents: read
  id-token: write

jobs:
  negative-control:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the wrapper identity is not trusted
        shell: bash
        env:
          NO_01_VERIFIER_URL: ${{ vars.NO_01_VERIFIER_URL }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=no_01-actions-policy-reusable")"
          token="$(jq -r '.value' <<<"$response")"
          payload="$(python3 -c 'import base64,sys; p=sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)).decode())' "$token")"
          jq -c '{actor,event_name,job_workflow_ref,ref,repository,run_id,workflow_ref}' <<<"$payload"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/no_01-negative-response.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "$NO_01_VERIFIER_URL")"
          printf 'NO_01_WRAPPER_VERIFIER_STATUS=%s\n' "$status"
          jq -c . "$RUNNER_TEMP/no_01-negative-response.json"
          test "$status" = 403
  call-sensitive:
    uses: ./.github/workflows/no_01-policy-reusable-sensitive.yml
    secrets: inherit
