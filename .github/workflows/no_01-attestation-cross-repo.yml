name: no_01 attestation cross-repository binding

on:
  push:
    paths:
      - .github/workflows/no_01-attestation-cross-repo.yml

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create fixed subject
        shell: bash
        run: printf %s NO_01_ATTEST_CROSS_REPO_20260929 > no_01-subject.bin

      - name: Generate and store source-repository attestation
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: no_01-subject.bin
          show-summary: false

      - name: Attempt exact bundle in another repository namespace
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TARGET_URL: https://api.github.com/repos/ilyyeees/no_01-relates-public-0929020509/attestations
        shell: bash
        run: |
          jq -n --slurpfile bundle "$BUNDLE_PATH" '{bundle: $bundle[0]}' > no_01-request.json
          status=$(curl --silent --show-error --output no_01-response.json --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @no_01-request.json \
            "$TARGET_URL")
          printf 'cross_repository_status=%s\n' "$status"
          jq '{id, message, status, errors}' no_01-response.json

      - name: Show source control identifiers
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        shell: bash
        run: |
          printf 'source_attestation_id=%s\n' "$ATTESTATION_ID"
          sha256sum no_01-subject.bin
