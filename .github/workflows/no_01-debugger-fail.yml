name: no_01 debugger failed-job control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-for-debugger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Controlled failure
        shell: bash
        run: |
          printf 'NO_01_DEBUGGER_FAILURE_CONTROL\n'
          exit 1
